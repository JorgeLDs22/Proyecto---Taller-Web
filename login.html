<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Intranet - Universidad Nacional de Innovación Peruana</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>UNIP - Intranet Institucional</h1>
        <nav>
            <ul>
                <li><a href="index.html">← Volver al Portal</a></li>
            </ul>
        </nav>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
        <section style="width: 100%; max-width: 400px;">
            <h2>Iniciar Sesión</h2>
            <p>Ingrese sus credenciales institucionales.</p>
            <form action="procesar_login.php" method="POST">
                <div class="form-group">
                    <label for="usuario">Código de Usuario / Correo:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej. U21308807" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="tipo">Perfil de Ingreso:</label>
                    <select id="tipo" name="tipo">
                        <option value="alumno">Estudiante</option>
                        <option value="docente">Docente</option>
                    </select>
                </div>
                <button type="submit" style="width: 100%;">Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Universidad Nacional de Innovación Peruana. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
